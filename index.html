<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sua chua TTHK</title>
    <link rel="stylesheet" href="./index.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="header">
      <h2>Quản lý sửa chữa</h2>
      <input type="file" id="fileInput" accept=".xlsx, .xls" />
    </div>

    <div class="table-wrapper">
      <table id="printerTable">
        <thead>
          <tr>
            <th>Phòng ban</th>
            <th>Phòng viết tắt</th>
            <th>Người đề nghị</th>
            <th>Cán bộ</th>
            <th>Đại diện đơn vị sử dụng</th>
            <th>Đại diện đơn vị sử dụng nhân viên</th>
            <th>Ngày</th>
            <th>Tháng</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="modal" class="modal">
      <h3>Sửa trước khi in</h3>
      <iframe
        id="modalIframe"
        src=""
        style="width: 100%; height: 85%; border: none"
      ></iframe>
      <div
        style="
          display: flex;
          justify-content: end;
          gap: 20px;
          margin-right: 50px;
        "
      >
        <button onclick="openHistoryModal()">Lịch sử</button>
        <button onclick="printIframe()">In hồ sơ</button>
        <button onclick="closeModal()">Đóng</button>
      </div>
    </div>
    <div id="historyModal" class="modal">
      <h3>Lịch sử hồ sơ đã in</h3>
      <div
        style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap"
      >
        <input
          id="historySearch"
          type="text"
          placeholder="Tìm theo phòng ban, người đề nghị..."
          style="flex: 1; min-width: 260px; padding: 8px"
          oninput="renderHistoryList()"
        />
        <button onclick="exportHistoryJson()">Xuất JSON</button>
        <button onclick="clearHistory()">Xoá toàn bộ</button>
        <button onclick="closeHistoryModal()">Đóng</button>
      </div>
      <div id="historyList" style="max-height: 70vh; overflow: auto"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
